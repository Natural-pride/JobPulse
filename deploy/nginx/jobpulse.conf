# JobPulse nginx site
# - Frontend static files served from /home/jobpulse/JobPulse/frontend/dist
# - /api/* proxied to backend on 127.0.0.1:3001
# - All other paths fall back to index.html (SPA routing)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Logs
    access_log /var/log/nginx/jobpulse.access.log;
    error_log  /var/log/nginx/jobpulse.error.log;

    # Body size — screenshot upload limit
    client_max_body_size 12m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Frontend static files
    root /home/jobpulse/JobPulse/frontend/dist;
    index index.html;

    # Long-cache hashed assets (Vite outputs /assets/<hash>.js etc.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming responses (none today, but harmless)
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Block dotfiles / source maps / anything not under dist
    location ~ /\.(?!well-known) {
        deny all;
    }

    # SPA fallback — every non-asset, non-API path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
